name: image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.*
      - fetch-qt.sh
      - slim-qt.sh
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/twintailteam/xiao-ci

jobs:
  image:
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    outputs:
      qt: ${{ steps.test.outputs.qt }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        run: docker build -f "Dockerfile.${{ matrix.arch }}" -t "$IMAGE:${{ matrix.arch }}" .
      - name: Test
        id: test
        run: |
          qt=$(docker run --rm "$IMAGE:${{ matrix.arch }}" sh -ec '"$QMAKE" -query QT_VERSION')
          [ -n "$qt" ]
          docker run --rm -e QT="$qt" "$IMAGE:${{ matrix.arch }}" sh -ec '
            prefix=$(dirname "$(dirname "$QMAKE")")
            test "$(dirname "$prefix")" = "/opt/qt/$QT"
            for file in "$prefix/lib/libQt6WebEngineCore.so.6" "$prefix/libexec/QtWebEngineProcess"; do
              if ldd "$file" | grep "not found"; then exit 1; fi
            done
            ls "/opt/qt/$QT"/msvc2022_*/bin/Qt6WebEngineCore.dll
          '
          echo "qt=$qt" >> "$GITHUB_OUTPUT"
      - name: Push
        run: |
          docker tag "$IMAGE:${{ matrix.arch }}" "$IMAGE:${{ matrix.arch }}-qt${{ steps.test.outputs.qt }}"
          docker push "$IMAGE:${{ matrix.arch }}"
          docker push "$IMAGE:${{ matrix.arch }}-qt${{ steps.test.outputs.qt }}"

  tags:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag latest and qt-${{ needs.image.outputs.qt }}
        run: docker buildx imagetools create -t "$IMAGE:latest" -t "$IMAGE:qt-${{ needs.image.outputs.qt }}" "$IMAGE:x86_64" "$IMAGE:aarch64"
